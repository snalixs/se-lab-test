name: t17-module-starter

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter_local
      POSTGRES_DB: starter
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - starter-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  starter-data: